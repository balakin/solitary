name: 🌐 Deploy site

# The docs site ships on its own schedule: it describes main, not the last
# release, and a typo fix has no reason to wait for one. release-please already
# excludes website/ from the CLI version, so nothing here can cut a release
# either.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {} # deny all by default; each job grants only what it needs

# One deployment at a time, and never cancelled: Pages replaces the whole site
# at once, so a half-uploaded artifact is the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read # checkout
    defaults:
      run:
        working-directory: website
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          package-manager-cache: false

      # pnpm is never installed by hand: `packageManager` pins the version and a
      # hash of its tarball, and corepack fetches exactly that.
      - name: 📦 Install package manager
        run: |
          corepack enable
          corepack install

      # No cache, deliberately, unlike verify.yml. Any job running on main can
      # write any cache entry, and verify runs the whole toolchain there — so a
      # store restored here would be one that third-party code had the chance
      # to fill, building a site that serves install.sh. Fetched fresh, every
      # package is checked against the lockfile's hashes instead.
      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      # A warning rather than a failure: a site without analytics is still the
      # site, and a docs fix should not wait on it. But the build drops the
      # tracker silently, so without this the only sign is a flat dashboard.
      - name: 📊 Check analytics configuration
        if: vars.VITE_UMAMI_WEBSITE_ID == ''
        run: echo "::warning title=Analytics off::VITE_UMAMI_WEBSITE_ID is not set, so this deploy has no analytics. Set it under Settings → Secrets and variables → Actions → Variables."

      # Prerenders every route and turns the catch-all into Pages' 404.html.
      # The Umami website ID is a variable rather than a secret: it ends up in
      # every page. Unset, the site builds without analytics rather than failing.
      - name: 🏗️ Build site
        run: pnpm build:pages
        env:
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build/client

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write # publish the artifact
      id-token: write # the deployment is authenticated by OIDC, not a token
    # GitHub's own environment rather than one named for the site: it is created
    # already restricted to the Pages source branch, where a name of our own
    # would start with no protection rules at all.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
