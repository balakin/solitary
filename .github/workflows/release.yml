name: 🚀 Release

on:
  push:
    branches: [main]

permissions: {} # deny all by default; each job grants only what it needs

# Releases are never cancelled mid-flight: a half-uploaded release is worse
# than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps a release pull request open on main, accumulating the changelog from
  # conventional commits. Merging it is what cuts a release: the action then
  # creates the GitHub release as a draft, which the job below fills and
  # publishes. Commits that only touch website/ are excluded in
  # release-please-config.json, so documentation work never moves the version.
  release-please:
    name: 📝 Release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      pull-requests: write # open and update the release pull request
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: 📝 Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the archives and finishes the release release-please drafted: the
  # uploads land on the draft, and undrafting it is the last thing that happens
  # — the point at which GitHub creates the tag and freezes the lot.
  goreleaser:
    name: 📦 Binaries
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # fill the draft release and publish it
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      # The commit the release was cut from, not the branch head, which may have
      # moved on since. Full history, because GoReleaser reads the tag from git.
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0

      # A draft release has no tag yet — GitHub creates it on publish — so the
      # tag exists here only to tell GoReleaser which version it is building.
      - name: 🏷️ Name the version being built
        run: git tag "$TAG"

      - name: 🐹 Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 🚀 Build, attach and publish
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
