version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/balakin/solitary/internal/cli.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# release-please owns the release notes and CHANGELOG.md, so GoReleaser writes
# none of its own.
changelog:
  disable: true

# Releases here are immutable, so nothing can be attached once one is published.
# GoReleaser already works that way — it uploads to a draft and undrafts it at
# the end — and use_existing_draft points it at the draft release-please left
# instead of a release of its own. keep-existing leaves that draft's notes alone,
# which is where the changelog already is.
release:
  use_existing_draft: true
  mode: keep-existing

# Homebrew installs come from a tap of our own: balakin/homebrew-solitary, which
# this pushes a formula to on every release.
#
# A formula rather than a cask, though GoReleaser deprecated `brews` in favour
# of `homebrew_casks`: casks install on macOS only, and a formula covers
# Linuxbrew with the same file. It also sidesteps Gatekeeper — Homebrew
# quarantines what a cask downloads and not what a formula downloads, and these
# binaries are unsigned, so a cask would need a postflight hook stripping the
# quarantine attribute back off. `brews` still works throughout v2 (it warns,
# and `goreleaser check` exits non-zero for it); v3 will remove it, and the
# replacement then is to generate the formula ourselves rather than to give up
# Linux.
#
# The token is a PAT with contents write on the tap, not GITHUB_TOKEN: that one
# is scoped to this repository and cannot push to another.
brews:
  - name: solitary
    # Homebrew reads Formula/ and nothing else once that directory exists: a
    # tap's formula directory is the first of Formula, HomebrewFormula and the
    # repository root that is present, and only that one is searched. GoReleaser
    # defaults this to the root — unlike homebrew_casks, which defaults to
    # Casks — so leaving it unset writes a formula Homebrew never reads, and
    # the tap keeps serving whatever was last written to Formula/.
    directory: Formula
    repository:
      owner: balakin
      name: homebrew-solitary
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    homepage: 'https://solitary.balakin.io'
    description: 'Run coding agents on a VM, not on your machine'
    license: 'Apache-2.0'
    # solitary drives limactl on the host and has nothing to run without it.
    dependencies:
      - name: lima
    # Everything else needs a machine to boot; this is what a formula can check
    # on a machine that is only installing it.
    test: |
      assert_match version.to_s, shell_output("#{bin}/solitary --version")
