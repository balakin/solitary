version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/balakin/solitary/internal/cli.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# release-please owns the release notes and CHANGELOG.md; GoReleaser only builds
# what goes on the release.
changelog:
  disable: true

# Publishing is left to the workflow. A published release here is immutable, so
# nothing can be attached to it afterwards: the archives have to be uploaded
# while the release is still a draft, and publishing is the last step.
release:
  disable: true

# A Homebrew tap is added here once the tap repository exists. Check the
# current GoReleaser docs for the right key before adding it: the Homebrew
# section has been reorganised more than once.
