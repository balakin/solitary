version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/balakin/solitary/internal/cli.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# release-please owns the release notes and CHANGELOG.md; GoReleaser only adds
# the archives to the release it already created.
changelog:
  disable: true

release:
  mode: append

# A Homebrew tap is added here once the tap repository exists. Check the
# current GoReleaser docs for the right key before adding it: the Homebrew
# section has been reorganised more than once.
