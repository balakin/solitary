version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Command stubs take parameters they do not use yet.
      - path: internal/(cli|lima|config)/
        text: "unused-parameter"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dm-balakin/solitary
