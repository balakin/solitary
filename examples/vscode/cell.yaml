description: >-
  An editor in a cell: code-server reached from the host's browser on port
  9797, with claude, node from nvm, corepack, and the extensions a web project
  wants. The network is left open, and 3000, 5173 and 8080 reach the
  host so a dev server started inside is one you can open.

# Try it:
#
#   solitary clone balakin/solitary/examples/vscode
#   solitary up vscode
#   solitary exec vscode editor-url
#   Open the URL it prints, and sign in with the password beside it.
#
# See https://solitary.balakin.io/docs/guides-examples

build: ./Containerfile

# cell-init seeds the home the first time the container starts — the editor's
# settings among it — and writes the password the editor asks for.
# seed-extensions makes sure the editor's own list names the extensions a
# rebuilt image added: it reads that list, not the directories beside it. The
# server is the container's life, so it runs in the foreground.
#
# 9797 rather than code-server's own 8080: that port belongs to whatever dev
# server you are here to work on. It is written twice — change --bind-addr and
# ports: together. The two directory flags are code-server's defaults spelled
# out: they are where cell-init seeds the settings and the extensions, and
# naming them here means the editor cannot look somewhere else. It checks
# GitHub for a newer release every six hours unless told not to, and a newer
# release reaches this cell by rebuilding it, not by a notice.
#
# Workspace trust is off because the cell is the boundary it stands in for.
# Left on, the editor opens the home in Restricted Mode and disables every
# extension in it — the theme, Claude Code, ESLint, Prettier — to keep code in
# an unfamiliar folder from running on your machine. Nothing in a cell runs on
# your machine, and the agent beside the editor runs code in it all day.
command: >
  cell-init && seed-extensions
  && exec code-server
  --bind-addr 0.0.0.0:9797
  --config "$HOME/.config/code-server/config.yaml"
  --user-data-dir "$HOME/.local/share/code-server"
  --extensions-dir "$HOME/.local/share/code-server/extensions"
  --disable-telemetry --disable-update-check --disable-workspace-trust

# Naming any port at all turns off forwarding every port the cell listens on,
# so a dev server started inside the editor does not reach the host until it is
# listed here too. The three after the editor are the ones a web project
# reaches for first — add yours beside them.
ports:
  - 9797 # the editor
  - 3000 # next, remix, rails
  - 5173 # vite
  - 8080 # everything else

vm:
  cpus: 4
  memory: 6GiB
# Claude signs in inside the cell, and the cell's home survives a container
# being replaced — so no key is declared for it. Uncomment ANTHROPIC_API_KEY to
# pass one in from ~/.config/solitary/cells/vscode/.env instead.
#
# GITHUB_TOKEN is the other way round: it is how gh authenticates, because a
# cell cannot open a browser on the host and `gh auth login` has nothing to
# launch. Optional, so the cell still starts without one — `up` offers it and
# enter skips it. Give it a fine-grained token scoped to the repositories this
# cell works on, and rotate it with `solitary secrets vscode`.
secrets:
  # ANTHROPIC_API_KEY:
  GITHUB_TOKEN:
    required: false
    description: gh — cloning, pushing branches and opening pull requests

# Named rather than found, so that claude has solitary's skills for working in a
# cell — publishing a file, reading what was sent in — from its first session.
agents:
  - claude-code

# Left open so the cell reaches whatever the host reaches: an allow list gates
# the build as well, and a domain missing from it fails the build rather than
# one request. The list that works for this cell is in the documentation, under
# "Restrict what it reaches".
#
# network:
#   allow:
#     - archive.ubuntu.com
#     - github.com
#     - open-vsx.org
#     - api.anthropic.com
