# Installed as /etc/tmux.conf. tmux reads it before ~/.tmux.conf, so the image
# owns the theme and a rebuild updates it, while a ~/.tmux.conf in the cell's
# home is still read after it for anything you want to override.

set-option -g status-position top

# ===========================================
# Catppuccin Theme (Mocha)
# ===========================================

# Catppuccin reads these when it is loaded, further down.
set -g @catppuccin_flavor 'mocha'

# Status bar modules (optional extras)
set -g @catppuccin_window_status_style "rounded"
# What Claude Code is doing in each window — 🤖 working, 💬 waiting for you,
# ✅ done — inside the Catppuccin pill. agent-status sets it from the hooks in
# ~/.claude/settings.json.
set -g @catppuccin_window_text " #T#{?@agent_status, #{@agent_status},}"
set -g @catppuccin_window_current_text " #T#{?@agent_status, #{@agent_status},}"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# ===========================================
# General Settings
# ===========================================

# Enable mouse support
set -g mouse on

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase history limit
set -g history-limit 50000

# Preserve modified keys such as Shift+Enter, which Claude Code reads as a new
# line rather than sending the message.
set -g extended-keys on
set -g extended-keys-format csi-u

# Tell panes when they gain focus. The hook below needs it, and so do editors
# that reload a file changed while you were elsewhere.
set -g focus-events on

# 💬 and ✅ ask to be seen, so they go once you look at the window. 🤖 stays
# until the agent says otherwise.
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{@agent_status},💬},#{==:#{@agent_status},✅}}" "set-option -uw @agent_status"'

# Reduce escape key delay
set -g escape-time 0

# Increase display time
set -g display-time 2000

# Redraw the status line every five seconds rather than fifteen, so the CPU and
# memory figures in it keep up.
set -g status-interval 5

# Size each window to the smallest client looking at it, not the smallest
# attached to the session.
setw -g aggressive-resize on

# ===========================================
# Copy Mode
# ===========================================

# Use vi keybindings in copy mode
setw -g mode-keys vi

# ===========================================
# Key Bindings
# ===========================================

# Reload config
bind r source-file /etc/tmux.conf \; display "Config reloaded!"

# Split panes with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ===========================================
# Theme (keep after its options above)
# ===========================================

# Loaded directly: the image installed it, so nothing needs a plugin manager to
# fetch or source it.
run '/etc/tmux/catppuccin/catppuccin.tmux'

# Show live system information instead of repeating the active pane title.
set -g status-right '#(/etc/tmux/system-stats.sh) | %H:%M %d-%b-%y'
set -g status-right-length 75
