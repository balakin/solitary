# The status line sits at the top, where workmux's per-window agent status is
# read at a glance rather than found at the bottom of a full-screen editor.
set-option -g status-position top

# A cell is usually driven from one terminal, so scrolling with the wheel and
# resizing a pane by dragging it are worth more here than a strict keyboard-only
# setup.
set-option -g mouse on
